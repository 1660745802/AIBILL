services:
  bill:
    build:
      context: .
      network: host
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    container_name: bill-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${BILL_DATA_DIR:-~/.bill}:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - DB_PATH=/app/data/bill.db
      # 行情刷新间隔（分钟）。默认 15——只在盘中/收盘后真的抓，
      # 休市时段这一跳什么都不做。想更密/更疏改这里即可。
      - QUOTE_REFRESH_MINUTES=${QUOTE_REFRESH_MINUTES:-15}
